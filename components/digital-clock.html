<style>

@import url(lib/api-getter/style.css) layer;

.clock {
  counter-reset:
    hour --get-time(h)
    minute --get-time(m)
    second --get-time(s);
  &::after {
    content:
      counter(hour, decimal-leading-zero) ':'
      counter(minute, decimal-leading-zero) ':'
      counter(second, decimal-leading-zero);
  }
}

@function --get-time(--t type(h | m | s)) returns <integer> {
  --time: --api-ok(--api-value());
  result: if(
    style(--t: h): --get-digit(var(--time), 3600, 24);
    style(--t: m): --get-digit(var(--time), 60, 60);
    style(--t: s): --get-digit(var(--time), 1, 60);
  );
}

</style>

<div class="container" apiscope>
  <api-source style="--api: url(https://css-api.surahotoke.workers.dev/info/datetime/clock)"></api-source>
  <div class="clock" apitarget></div>
</div>
